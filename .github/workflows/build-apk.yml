name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Install Chromium for end-to-end tests
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      # Two copies: one named by commit for the workflow artifact (traceable), and one with a
      # stable name for the release, so the download link never changes and the release page
      # never accumulates a pile of near-identical files to choose between.
      - name: Rename
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk iron-${{ github.sha }}.apk
          cp android/app/build/outputs/apk/release/app-release.apk iron.apk

      - uses: actions/upload-artifact@v4
        with:
          name: iron-apk
          path: iron-${{ github.sha }}.apk
          retention-days: 90

      # Every push also refreshes a rolling "iron-latest" release so the APK has a stable download link.
      # (The "latest" tag belongs to the meal-tracker app in this repo; keep the two apart.)
      - name: Publish latest release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/claude/workout-logger')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: iron-latest
          name: Iron (latest build)
          # Not a prerelease: GitHub excludes prereleases from /releases/latest resolution,
          # which makes the stable download URL 404 forever.
          prerelease: false
          make_latest: true
          files: iron.apk
          body: |
            Signed release APK built from ${{ github.sha }}.
            Download, open on the phone, allow installs from this source, done.

            Stable link: https://github.com/${{ github.repository }}/releases/download/iron-latest/iron.apk
