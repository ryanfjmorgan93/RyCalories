<!--
  Iron's app icon: an ember competition plate with a brushed-steel hub (chosen by the owner, November 2026).
  The master every icon file is rendered from by scripts/app-icon.mjs. The hub's brushed steel is a
  conic sweep, which SVG has no gradient for, so it is HTML inside the SVG: this file renders in a
  browser, not as an <img>. public/icons/icon.svg is the plain-SVG cousin for the browser tab.
  #tile is the dark tile behind the plate; the Android foreground layer leaves it out.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="ember" x1="0.15" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ff9448"/><stop offset="0.5" stop-color="#ff5a1f"/><stop offset="1" stop-color="#c22f02"/>
    </linearGradient>
    <linearGradient id="emberIn" x1="0.15" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#e2440c"/><stop offset="1" stop-color="#ff7d38"/>
    </linearGradient>
    <radialGradient id="lit" cx="0.3" cy="0.22" r="0.75">
      <stop offset="0" stop-color="#fff" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shade" cx="0.74" cy="0.8" r="0.7">
      <stop offset="0" stop-color="#000" stop-opacity="0.38"/>
      <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="175%">
      <feDropShadow dx="0" dy="26" stdDeviation="28" flood-color="#000" flood-opacity="0.72"/>
    </filter>
    <radialGradient id="bg" cx="0.5" cy="0.42" r="0.85"><stop offset="0" stop-color="#202024"/><stop offset="1" stop-color="#040405"/></radialGradient>
  </defs>
  <rect id="tile" width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="512" r="338" fill="url(#ember)" filter="url(#sh)"/>
  <circle cx="512" cy="512" r="304" fill="url(#emberIn)"/>
  <circle cx="512" cy="512" r="304" fill="none" stroke="#6e1a00" stroke-opacity="0.45" stroke-width="5"/>
  <circle cx="512" cy="512" r="300" fill="none" stroke="#fff" stroke-opacity="0.16" stroke-width="2"/>
  <circle cx="512" cy="512" r="232" fill="url(#ember)"/>
  <circle cx="512" cy="512" r="232" fill="none" stroke="#fff" stroke-opacity="0.26" stroke-width="3"/>
  <circle cx="512" cy="512" r="236" fill="none" stroke="#6e1a00" stroke-opacity="0.3" stroke-width="4"/>
  <circle cx="512" cy="512" r="338" fill="url(#lit)" opacity="0.5"/>
  <path d="M 214 404 A 320 320 0 0 1 404 214" fill="none" stroke="#fff" stroke-opacity="0.6" stroke-width="5" stroke-linecap="round"/>
  <circle cx="512" cy="512" r="336" fill="none" stroke="#fff" stroke-opacity="0.2" stroke-width="2"/>
  
  <foreignObject x="356" y="356" width="312" height="312">
    <div xmlns="http://www.w3.org/1999/xhtml" style="width:312px;height:312px;border-radius:50%;background:conic-gradient(from 210deg,#f7f7f9,#8d8d96 12%,#eeeef1 24%,#74747c 37%,#f4f4f6 50%,#8a8a93 62%,#ececef 75%,#6e6e76 88%,#f7f7f9)"></div>
  </foreignObject>
  <circle cx="512" cy="512" r="156" fill="none" stroke="#1d1d20" stroke-opacity="0.55" stroke-width="3"/>
  <circle cx="512" cy="512" r="151" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="2"/>
  <foreignObject x="416" y="416" width="192" height="192">
    <div xmlns="http://www.w3.org/1999/xhtml" style="width:192px;height:192px;border-radius:50%;background:conic-gradient(from 30deg,#d9d9de,#6a6a72 14%,#cfcfd5 28%,#5e5e66 42%,#d6d6db 56%,#666 70%,#cdcdd3 85%,#d9d9de)"></div>
  </foreignObject>
  <circle cx="512" cy="512" r="96" fill="none" stroke="#1d1d20" stroke-opacity="0.5" stroke-width="2.5"/>
  <circle cx="512.0" cy="386.0" r="12" fill="#3c3c43"/><circle cx="509.5" cy="383.5" r="6.5" fill="#e9e9ee"/><circle cx="621.1" cy="449.0" r="12" fill="#3c3c43"/><circle cx="618.6" cy="446.5" r="6.5" fill="#e9e9ee"/><circle cx="621.1" cy="575.0" r="12" fill="#3c3c43"/><circle cx="618.6" cy="572.5" r="6.5" fill="#e9e9ee"/><circle cx="512.0" cy="638.0" r="12" fill="#3c3c43"/><circle cx="509.5" cy="635.5" r="6.5" fill="#e9e9ee"/><circle cx="402.9" cy="575.0" r="12" fill="#3c3c43"/><circle cx="400.4" cy="572.5" r="6.5" fill="#e9e9ee"/><circle cx="402.9" cy="449.0" r="12" fill="#3c3c43"/><circle cx="400.4" cy="446.5" r="6.5" fill="#e9e9ee"/>
  <circle cx="512" cy="512" r="46" fill="#040405"/>
  <circle cx="512" cy="512" r="46" fill="none" stroke="#fff" stroke-opacity="0.32" stroke-width="3"/>
  <circle cx="512" cy="512" r="40" fill="none" stroke="#000" stroke-opacity="0.8" stroke-width="8"/>
</svg>
